<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#102b30"><title>台北垃圾車地圖｜清運時間與推估位置</title><meta name="description" content="查看台北市官方垃圾清運站點、表定時間及依時刻表推估的車輛位置。非即時 GPS。"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23102b30'/%3E%3Cpath d='M8 11h16l-2 15H10zM6 8h20M12 5h8' stroke='%23d3fa68' stroke-width='2' fill='none'/%3E%3C/svg%3E"><link rel="stylesheet" href="leaflet.css"><link rel="stylesheet" href="style.css"><script defer src="leaflet.js"></script><script defer src="logic.js"></script><script defer src="app.js"></script></head><body>
<header><div class="brand"><span class="mark" aria-hidden="true">♻</span><div><h1>台北垃圾車地圖</h1><span class="sub">TAIPEI COLLECTION MAP</span></div></div><div class="clock"><span class="badge">時刻表推估</span><time id="clock">台北時間</time></div></header>
<main><aside aria-label="清運路線"><div class="controls"><div class="intro"><h2>今天，在哪裡倒垃圾？</h2><p>找附近清運點，查看下一班表定時間。</p></div><div class="row"><div class="field"><label for="district">行政區</label><select id="district"><option value="">全台北市</option></select></div><button id="locate" class="locate">◎ 找我附近</button></div><label for="search" class="sr-only">搜尋路線或清運地址</label><input id="search" type="search" placeholder="搜尋路線、街道或清運地址"><div class="timeline"><label for="preview">查看時間</label><input id="preview" type="time" aria-label="預覽今天的其他時間"><button id="live">回到現在</button></div><p id="notice" class="notice">載入官方清運資料中…</p><div class="summary"><strong id="count">—</strong><span id="mode">表定清運中</span><span id="resultCount"></span></div></div><div id="routes" class="route-list" aria-label="搜尋結果"></div><footer><a href="https://data.taipei/dataset/detail?id=6bb3304b-4f46-4bb0-8cd1-60c66dcd1cae" target="_blank" rel="noopener">台北市環保局官方資料 ↗</a><span>資料版本 2026.09.21 · 12 區 / 4,012 站</span><a href="https://www.dep.gov.taipei/" target="_blank" rel="noopener">特殊停收與臨時異動請查看環保局公告 ↗</a></footer></aside>
<section class="map-panel" aria-label="清運地圖"><div id="map"></div><div class="map-label"><span class="eyebrow">ESTIMATED POSITION</span><strong>🚛 車輛位置依時刻表推估</strong><p>站點間以直線內插，非道路軌跡、非即時 GPS。</p></div><div id="mapError" hidden>底圖暫時無法載入，仍可查看清運點與時刻表。</div><button id="fit" class="fit">顯示所有結果</button><div class="legend"><span><i class="vehicle-dot"></i> 推估車輛</span><span><i class="stop-dot"></i> 清運點</span></div></section>
<section id="detail" class="detail" hidden aria-label="路線站點明細"><div class="detail-top"><div><span id="detailDistrict" class="eyebrow"></span><h2 id="detailTitle"></h2></div><button id="close" aria-label="關閉明細">✕</button></div><p id="detailStatus"></p><div id="stops"></div></section></main><div id="toast" role="status" aria-live="polite"></div>
</body></html>
